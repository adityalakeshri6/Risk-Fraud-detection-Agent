<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk Ledger — Fraud Detection Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F5F4EE;
    --paper-raised: #FBFAF6;
    --ink: #1B2430;
    --ink-soft: #5A6472;
    --rule: #C9C4B4;
    --green: #1F7A4D;
    --amber: #B9770E;
    --red: #B23A2E;
    --brass: #A98544;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* subtle paper texture via layered gradients */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg, rgba(27,36,48,0.015) 0px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(27,36,48,0.015) 0px, transparent 1px, transparent 3px);
    z-index: 0;
  }

  header {
    padding: 2.5rem 2rem 1.5rem;
    text-align: center;
    border-bottom: 1px solid var(--rule);
    position: relative;
    z-index: 1;
  }

  header .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 0.5rem;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-top: 0.6rem;
  }

  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    max-width: 1180px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .form-panel {
    padding: 2rem;
    border-right: 1px dashed var(--rule);
  }

  @media (max-width: 860px) {
    .form-panel { border-right: none; border-bottom: 1px dashed var(--rule); }
  }

  .panel-title {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 1.4rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .panel-title::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--brass);
    border-radius: 50%;
    display: inline-block;
  }

  .field {
    margin-bottom: 1.1rem;
  }

  .field label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    margin-bottom: 0.35rem;
  }

  .field input, .field select {
    width: 100%;
    padding: 0.55rem 0.6rem;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    background: transparent;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .field input:focus, .field select:focus {
    border-bottom-color: var(--brass);
  }

  .btn-row {
    display: flex;
    gap: 0.6rem;
    margin-top: 1.6rem;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.75rem 1.1rem;
    border-radius: 3px;
    border: none;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }

  button:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    flex: 1;
  }

  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: wait; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
  }

  .btn-secondary:hover { border-color: var(--brass); color: var(--ink); }

  .ledger-panel {
    padding: 2rem;
  }

  .ledger-empty {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 0.85rem;
    padding: 3rem 1rem;
    text-align: center;
    border: 1px dashed var(--rule);
    border-radius: 4px;
  }

  .entry {
    position: relative;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 1.3rem 1.5rem;
    margin-bottom: 1rem;
    overflow: hidden;
    animation: slideIn 0.35s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.7rem;
  }

  .entry-amount {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-weight: 600;
  }

  .entry-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .entry-factors {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 0.6rem;
    letter-spacing: 0.02em;
  }

  .entry-explanation {
    font-size: 0.88rem;
    line-height: 1.5;
    color: var(--ink);
    border-top: 1px dashed var(--rule);
    padding-top: 0.7rem;
  }

  .stamp {
    position: absolute;
    top: 0.9rem;
    right: 1.3rem;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    padding: 0.3rem 0.7rem;
    border: 2px solid currentColor;
    border-radius: 3px;
    transform: rotate(-6deg);
    animation: stamp 0.3s cubic-bezier(0.2, 1.4, 0.4, 1) 0.15s both;
  }

  @keyframes stamp {
    from { opacity: 0; transform: rotate(-6deg) scale(1.8); }
    to { opacity: 1; transform: rotate(-6deg) scale(1); }
  }

  .stamp.low { color: var(--green); }
  .stamp.medium { color: var(--amber); }
  .stamp.high { color: var(--red); }

  footer {
    text-align: center;
    padding: 2rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Fraud / Risk Detection Agent</div>
  <h1>The Risk Ledger</h1>
  <p>Every transaction, scored and explained in plain language</p>
</header>

<div class="layout">
  <div class="form-panel">
    <div class="panel-title">New Transaction</div>

    <div class="field">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" value="45000">
    </div>
    <div class="field">
      <label for="velocity">Transactions in last 60s</label>
      <input type="number" id="velocity" value="4">
    </div>
    <div class="field">
      <label for="geo">Distance from last known location (km)</label>
      <input type="number" id="geo" value="380">
    </div>
    <div class="field">
      <label for="device">New device?</label>
      <select id="device">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </div>
    <div class="field">
      <label for="hour">Hour of day (0–23)</label>
      <input type="number" id="hour" value="3" min="0" max="23">
    </div>
    <div class="field">
      <label for="merchant">Merchant risk score (0–1)</label>
      <input type="number" id="merchant" value="0.7" min="0" max="1" step="0.01">
    </div>

    <div class="btn-row">
      <button class="btn-primary" id="scoreBtn" onclick="scoreTransaction()">Score transaction</button>
      <button class="btn-secondary" onclick="randomize()">Randomize</button>
    </div>
  </div>

  <div class="ledger-panel">
    <div class="panel-title">Ledger</div>
    <div id="ledger">
      <div class="ledger-empty">No transactions scored yet — submit one on the left.</div>
    </div>
  </div>
</div>

<footer>Risk Ledger — demo interface for the Razorpay AI Buildathon submission</footer>

<script>
  const API_BASE = window.location.origin;
  let firstEntry = true;

  async function scoreTransaction() {
    const btn = document.getElementById('scoreBtn');
    btn.disabled = true;
    btn.textContent = 'Scoring…';

    const payload = {
      amount: parseFloat(document.getElementById('amount').value),
      txn_velocity_1min: parseInt(document.getElementById('velocity').value),
      geo_distance_km: parseFloat(document.getElementById('geo').value),
      is_new_device: parseInt(document.getElementById('device').value),
      hour_of_day: parseInt(document.getElementById('hour').value),
      merchant_risk_score: parseFloat(document.getElementById('merchant').value),
    };

    try {
      const res = await fetch(`${API_BASE}/score`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      const data = await res.json();
      addEntry(payload, data);
    } catch (err) {
      addError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Score transaction';
    }
  }

  function addEntry(payload, result) {
    if (firstEntry) {
      document.getElementById('ledger').innerHTML = '';
      firstEntry = false;
    }
    const decision = result.decision; // APPROVE / REVIEW / BLOCK
    const stampClass = decision === 'APPROVE' ? 'low' : decision === 'BLOCK' ? 'high' : 'medium';
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = `
      <div class="stamp ${stampClass}">${decision}</div>
      <div class="entry-top">
        <div class="entry-amount">₹${payload.amount.toLocaleString('en-IN')}</div>
        <div class="entry-score">risk ${(result.risk_score * 100).toFixed(1)}%</div>
      </div>
      <div class="entry-factors">TOP FACTORS — ${result.top_factors.join(' · ')}</div>
      <div class="entry-explanation">${result.explanation}</div>
    `;
    document.getElementById('ledger').prepend(el);
  }

  function addError(msg) {
    if (firstEntry) {
      document.getElementById('ledger').innerHTML = '';
      firstEntry = false;
    }
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML = `<div class="entry-explanation" style="color: var(--red);">Couldn't reach the scoring API: ${msg}. Make sure the server is running.</div>`;
    document.getElementById('ledger').prepend(el);
  }

  function randomize() {
    document.getElementById('amount').value = Math.floor(Math.random() * 90000 + 500);
    document.getElementById('velocity').value = Math.floor(Math.random() * 6);
    document.getElementById('geo').value = Math.floor(Math.random() * 500);
    document.getElementById('device').value = Math.random() > 0.5 ? '1' : '0';
    document.getElementById('hour').value = Math.floor(Math.random() * 24);
    document.getElementById('merchant').value = (Math.random()).toFixed(2);
  }
</script>

</body>
</html>
